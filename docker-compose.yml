services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mdquery
      POSTGRES_PASSWORD: mdquery
      POSTGRES_DB: mdquery
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mdquery']
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: postgres://mdquery:mdquery@db:5432/mdquery
      # Secrets live in .env (gitignored, read automatically by docker compose) — see .env.example
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-in-production}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      # Windows bind mounts don't propagate file-change events — poll instead so edits hot-reload
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      # Override with WEB_PORT in .env if 3000 is already taken on the host
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  node_modules:
  next_cache:
